[package]
name = "pulsemon"
version = "0.2.1"
edition = "2021"
description = "Cross-platform system monitor TUI — CPU, memory, disk, GPU, ports, process management"
license = "MIT"
repository = "https://github.com/Anyesh/pulsemon"
documentation = "https://github.com/Anyesh/pulsemon#readme"
homepage = "https://github.com/Anyesh/pulsemon"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.39"
nvml-wrapper = "0.10"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
